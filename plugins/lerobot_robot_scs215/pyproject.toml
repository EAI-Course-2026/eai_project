[project]
name = "lerobot_robot_scs215"
version = "0.1.0"
description = "SCS215 SO101 robot plugin and shared verified motor bus for LeRobot"
requires-python = ">=3.12,<3.13"
dependencies = ["lerobot[feetech]==0.6.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lerobot_robot_scs215"]
