name: Shared baseline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    name: Offline tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2, same as pinned fork
        with:
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run --no-sync python scripts/check_env.py
      - run: uv run --no-sync python -m unittest discover -s tests -q
      - run: uv build --wheel
