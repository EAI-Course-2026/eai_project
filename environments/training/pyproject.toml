[project]
name = "eai-training-environment"
version = "0.1.0"
description = "Separate course-fork training runtime: NVIDIA CUDA on Windows/Linux, native PyTorch on Mac"
requires-python = ">=3.12,<3.13"
dependencies = ["lerobot_robot_scs215==0.1.0", "lerobot[training,core_scripts,feetech,smolvla,pi]==0.6.2", "torch>=2.7,<2.12", "torchvision>=0.22,<0.27"]

[tool.uv]
required-version = "==0.11.7"

[tool.uv.sources]
lerobot_robot_scs215 = { path = "../../plugins/lerobot_robot_scs215", editable = true }
lerobot = { git = "https://github.com/EAI-Course-2026/eai-course-lerobot.git", rev = "6a077907c7989635218969ee78f5436f8faec92b" }
# These wheels contain CUDA support; a compatible NVIDIA GPU/driver is still required.
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
